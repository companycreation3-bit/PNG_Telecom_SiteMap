<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Iso Yawi Telecom Site Login Tool">
    <meta name="author" content="Iso Yawi Telecom">

    <title>Iso Yawi Telecom Site Login Tool</title>

    <style>
        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #e31e24;
            --primary-dark: #a80f16;
            --white: #ffffff;
            --text-light: #f3f4f6;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            color: var(--white);

            /* YOUR BACKGROUND IMAGE */
            background:
                linear-gradient(
                    135deg,
                    rgba(5, 12, 25, 0.78),
                    rgba(12, 18, 35, 0.55)
                ),
                url("background.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* MAIN CONTAINER */
        .login-container {
            width: 100%;
            max-width: 430px;
            position: relative;
            margine-right: auto;
            margine-left: 5%;

            /* Keep the login centered on mobile */
            @media (max-width: 480px) {
                .login-container { 
                    margin-left: auto; 
                    margin-right: auto;
                    } 
                }
      
        /* GLASS LOGIN CARD */
        .login-card {
            position: relative;
            padding: 42px 35px;
            border-radius: 22px;

            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.25);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.40),
                inset 0 1px 1px rgba(255, 255, 255, 0.15);

            overflow: hidden;
        }

        .login-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;

            background: linear-gradient(
                90deg,
                #e31e24,
                #ffffff,
                #e31e24
            );
        }

        /* LOGO / BRAND ICON */
        .brand-icon {
            width: 82px;
            height: 82px;
            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;
            background: rgba(227, 30, 36, 0.95);
            border: 3px solid rgba(255, 255, 255, 0.85);

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
        }

        .brand-icon svg {
            width: 45px;
            height: 45px;
            stroke: #ffffff;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* HEADING */
        .brand-name {
            text-align: center;
            font-size: 25px;
            font-weight: 800;
            letter-spacing: 1.4px;
            margin-bottom: 8px;
        }

        .brand-name span {
            color: #ff454b;
        }

        .page-title {
            text-align: center;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-light);
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.72);
            font-size: 12px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* FORM */
        .form-group {
            margin-bottom: 21px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 9px;
            color: #ffffff;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            height: 50px;
            padding: 0 15px;

            font-size: 14px;
            color: #ffffff;

            background: rgba(255, 255, 255, 0.09);
            border: 1px solid rgba(255, 255, 255, 0.23);
            border-radius: 10px;

            outline: none;
            transition: 0.25s ease;
        }

        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.52);
        }

        .input-wrapper input:focus {
            border-color: #ff454b;
            background: rgba(255, 255, 255, 0.14);
            box-shadow: 0 0 0 3px rgba(227, 30, 36, 0.18);
        }

        .password-input {
            padding-right: 76px !important;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);

            background: none;
            border: none;
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;

            cursor: pointer;
            padding: 5px;
        }

        .toggle-password:hover {
            color: #ff7479;
        }

        /* OPTIONS */
        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin: 2px 0 24px;
            font-size: 12px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 7px;
            color: rgba(255, 255, 255, 0.85);
        }

        .remember-me input {
            accent-color: var(--primary);
            cursor: pointer;
        }

        .secure-label {
            color: rgba(255, 255, 255, 0.65);
        }

        /* LOGIN BUTTON */
        .login-button {
            width: 100%;
            height: 51px;

            border: none;
            border-radius: 10px;

            color: #ffffff;
            background: linear-gradient(
                135deg,
                #e31e24,
                #b90e16
            );

            font-size: 14px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;

            cursor: pointer;
            transition: 0.25s ease;

            box-shadow: 0 8px 20px rgba(227, 30, 36, 0.28);
        }

        .login-button:hover {
            transform: translateY(-2px);
            background: linear-gradient(
                135deg,
                #f02b31,
                #c4121a
            );

            box-shadow: 0 12px 25px rgba(227, 30, 36, 0.38);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .login-button:disabled {
            opacity: 0.7;
            cursor: wait;
        }

        /* MESSAGE */
        .message {
            display: none;
            margin-top: 16px;
            padding: 11px;
            border-radius: 8px;
            text-align: center;
            font-size: 12px;
            line-height: 1.5;
        }

        .message.error {
            display: block;
            color: #ffdadd;
            background: rgba(227, 30, 36, 0.20);
            border: 1px solid rgba(255, 100, 105, 0.4);
        }

        /* FOOTER */
        .login-footer {
            text-align: center;
            margin-top: 26px;
            font-size: 11px;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.70);
        }

        .login-footer strong {
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .copyright {
            margin-top: 8px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.48);
        }

        /* MOBILE */
        @media (max-width: 480px) {
            body {
                padding: 16px;
                background-attachment: scroll;
            }

            .login-card {
                padding: 35px 23px;
                border-radius: 18px;
            }

            .brand-name {
                font-size: 22px;
            }

            .brand-icon {
                width: 72px;
                height: 72px;
            }

            .page-title {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <div class="brand-icon" aria-hidden="true">
                <svg viewBox="0 0 48 48">
                    <path d="M24 5 L39 11 V22 C39 32 32 39 24 43 C16 39 9 32 9 22 V11 Z"></path>
                    <circle cx="24" cy="18" r="3"></circle>
                    <circle cx="16" cy="28" r="2.5"></circle>
                    <circle cx="32" cy="28" r="2.5"></circle>
                    <path d="M24 21 V25 M24 25 L16 28 M24 25 L32 28"></path>
                </svg>
            </div>

            <h1 class="brand-name">
                ISO YAWI <span>TELECOM</span>
            </h1>

            <h2 class="page-title">
                Telecom Site Login Tool
            </h2>

            <p class="subtitle">
                Authorised access only. Please sign in to access
                the telecom site mapping system.
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="username">Username</label>

                    <div class="input-wrapper">
                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="input-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="password-input"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="togglePassword"
                            aria-label="Show password"
                        >
                            SHOW
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        Remember me
                    </label>

                    <span class="secure-label">
                        Protected Access
                    </span>
                </div>

                <button type="submit" class="login-button" id="loginButton">
                    Sign In Securely
                </button>

                <div
                    id="message"
                    class="message"
                    role="alert"
                    aria-live="polite"
                ></div>

            </form>

            <footer class="login-footer">
                <strong>ISO YAWI TELECOM</strong>
                <p>Telecom Infrastructure &amp; Site Mapping</p>

                <p class="copyright">
                    &copy; <span id="currentYear"></span>
                    Iso Yawi Telecom. All rights reserved.
                </p>
            </footer>

        </section>

    </main>

    <script>
        // ==========================================
        // LOGIN CONFIGURATION
        // ==========================================

        const VALID_USERNAME = "Admin";
        const VALID_PASSWORD = "Password1234";

        // Change this to the actual filename of your site map.
        const MAP_PAGE = "PNG_Digital_Telecom_Site_Map_Pro.html";

        // ==========================================
        // PAGE ELEMENTS
        // ==========================================

        const loginForm = document.getElementById("loginForm");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");
        const loginButton = document.getElementById("loginButton");
        const message = document.getElementById("message");

        document.getElementById("currentYear").textContent =
            new Date().getFullYear();

        // ==========================================
        // SHOW / HIDE PASSWORD
        // ==========================================

        togglePassword.addEventListener("click", function () {
            const isPassword = passwordInput.type === "password";

            passwordInput.type = isPassword ? "text" : "password";
            togglePassword.textContent = isPassword ? "HIDE" : "SHOW";

            togglePassword.setAttribute(
                "aria-label",
                isPassword ? "Hide password" : "Show password"
            );
        });

        // ==========================================
        // DISPLAY LOGIN MESSAGE
        // ==========================================

        function showMessage(text) {
            message.textContent = text;
            message.className = "message error";
        }

        // ==========================================
        // LOGIN VALIDATION
        // ==========================================

        loginForm.addEventListener("submit", function (event) {
            event.preventDefault();

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (
                username === VALID_USERNAME &&
                password === VALID_PASSWORD
            ) {
                message.style.display = "none";

                // Demonstration only; this is not secure authentication.
                sessionStorage.setItem("isoYawiLogin", "true");

                loginButton.textContent = "Signing In...";
                loginButton.disabled = true;

                window.location.href = MAP_PAGE;

            } else {
                showMessage(
                    "Incorrect username or password. Please try again."
                );

                passwordInput.value = "";
                passwordInput.focus();
            }
        });
    </script>

</body>
</html>
